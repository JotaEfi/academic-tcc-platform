name: Deploy to Production

on:
    push:
        branches:
            - main
    workflow_dispatch:

jobs:
    deploy:
        name: Deploy Application
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "18"
                  cache: "npm"

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.2"
                  extensions: mbstring, xml, ctype, json, bcmath, pdo, pdo_pgsql, pdo_sqlite, sqlite3
                  tools: composer:v2

            - name: Install PHP dependencies
              run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

            - name: Install Node.js dependencies
              run: npm ci --production=false

            - name: Build frontend assets
              run: VITE_API_URL=${{ secrets.APP_URL }}/api npm run build

            - name: Create .env file
              env:
                  APP_NAME: ${{ secrets.APP_NAME }}
                  APP_ENV: ${{ secrets.APP_ENV || 'production' }}
                  APP_KEY: ${{ secrets.APP_KEY }}
                  APP_DEBUG: ${{ secrets.APP_DEBUG || 'false' }}
                  APP_URL: ${{ secrets.APP_URL }}
                  DB_CONNECTION: ${{ secrets.DB_CONNECTION || 'mysql' }}
                  DB_HOST: ${{ secrets.DB_HOST }}
                  DB_PORT: ${{ secrets.DB_PORT || 3306 }}
                  DB_DATABASE: ${{ secrets.DB_DATABASE }}
                  DB_USERNAME: ${{ secrets.DB_USERNAME }}
                  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
              run: |
                  cat > .env << 'EOF'
                  APP_NAME="${{ env.APP_NAME }}"
                  APP_ENV=${{ env.APP_ENV }}
                  APP_KEY=${{ env.APP_KEY }}
                  APP_DEBUG=${{ env.APP_DEBUG }}
                  APP_URL=${{ env.APP_URL }}

                  APP_LOCALE=pt_BR
                  APP_FALLBACK_LOCALE=pt_BR
                  APP_FAKER_LOCALE=pt_BR

                  APP_MAINTENANCE_DRIVER=file
                  BCRYPT_ROUNDS=12

                  LOG_CHANNEL=stack
                  LOG_STACK=single
                  LOG_DEPRECATIONS_CHANNEL=null
                  LOG_LEVEL=error

                  DB_CONNECTION=sqlite
                  DB_HOST=127.0.0.1
                  DB_PORT=3306
                  DB_DATABASE=database/database.sqlite
                  DB_USERNAME=null
                  DB_PASSWORD=null

                  SESSION_DRIVER=file
                  SESSION_LIFETIME=120
                  SESSION_ENCRYPT=false
                  SESSION_PATH=/
                  SESSION_DOMAIN=null

                  BROADCAST_CONNECTION=log
                  FILESYSTEM_DISK=local
                  QUEUE_CONNECTION=database

                  CACHE_STORE=database

                  VITE_APP_NAME="${{ env.APP_NAME }}"
                  EOF

            - name: Create deployment script
              run: |
                  cat > deploy.sh << 'DEPLOY_SCRIPT'
                  #!/bin/bash
                  set -e

                  # Cores para output
                  GREEN='\033[0;32m'
                  YELLOW='\033[1;33m'
                  NC='\033[0m'

                  echo -e "${GREEN}🚀 Iniciando deploy da aplicação...${NC}"

                  # Remover index.htm padrão se existir (para evitar conflito com .htaccess)
                  if [ -f "index.htm" ]; then
                    echo -e "${YELLOW}🗑️  Removendo index.htm padrão...${NC}"
                    rm index.htm
                  fi

                  # Verificar se é o primeiro deploy
                  if [ ! -f ".env.deployed" ]; then
                    FIRST_DEPLOY=true
                    echo -e "${YELLOW}📝 Primeiro deploy detectado${NC}"
                    touch .env.deployed
                  else
                    FIRST_DEPLOY=false
                    echo -e "${GREEN}🔄 Deploy de atualização${NC}"
                  fi

                  # Ativar modo de manutenção (exceto no primeiro deploy)
                  if [ "$FIRST_DEPLOY" = false ]; then
                    echo -e "${YELLOW}� Ativando modo de manutenção...${NC}"
                    php artisan down || true
                  fi

                  # Gerar chave da aplicação (apenas no primeiro deploy se não fornecida)
                  if [ "$FIRST_DEPLOY" = true ]; then
                    if ! grep -q "APP_KEY=base64:" .env; then
                      echo -e "${GREEN}🔑 Gerando chave da aplicação...${NC}"
                      php artisan key:generate --force
                    fi
                  fi

                  # Instalar dependências do PHP
                  echo -e "${GREEN}📦 Instalando dependências do Composer...${NC}"
                  composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist


                  # Executar migrations
                  echo -e "${GREEN}🗄️  Executando migrations...${NC}"
                  php artisan migrate --force

                  # Otimizações Laravel
                  echo -e "${GREEN}⚡ Otimizando aplicação...${NC}"
                  php artisan config:cache
                  php artisan route:cache
                  php artisan view:cache
                  php artisan event:cache

                  # Ajustar permissões
                  echo -e "${GREEN}🔒 Ajustando permissões...${NC}"
                  chmod -R 755 storage bootstrap/cache 2>/dev/null || true

                  # Desativar modo de manutenção
                  if [ "$FIRST_DEPLOY" = false ]; then
                    echo -e "${GREEN}✅ Desativando modo de manutenção...${NC}"
                    php artisan up
                  fi

                  echo -e "${GREEN}✨ Deploy concluído com sucesso!${NC}"
                  DEPLOY_SCRIPT
                  chmod +x deploy.sh

            - name: Compress files
              run: |
                  zip -r release.zip . -x ".git/*" ".github/*" "tests/*" "node_modules/*" "deploy.sh" ".env.example" ".editorconfig" ".gitignore" ".gitattributes" "phpunit.xml" "vite.config.js" "package.json" "README.md" "resources/js/*" "resources/css/*"
                  echo "📦 Verificando conteúdo do ZIP:"
                  unzip -l release.zip | grep "vendor/autoload.php" || echo "❌ vendor/autoload.php NÃO encontrado no ZIP!"

            - name: 📂 Create Finalize Script
              run: |
                  cat > public/finalize.php << 'PHP_FINALIZE'
                  <?php
                  ini_set('display_errors', 1);
                  error_reporting(E_ALL);
                  set_time_limit(600);

                  function shutdown() {
                      $error = error_get_last();
                      if ($error && ($error['type'] === E_ERROR || $error['type'] === E_PARSE || $error['type'] === E_COMPILE_ERROR)) {
                          echo "\n❌ FATAL ERROR: " . $error['message'] . " in " . $error['file'] . ":" . $error['line'] . "\n";
                      }
                      echo "</pre>";
                  }
                  register_shutdown_function('shutdown');

                  echo "<h1>🚀 Finalizing Deployment (SQLite + Cache Clear)</h1><pre>";

                  $root = dirname(__DIR__);
                  echo "Root: $root\n";

                  // DEBUG: Check app.blade.php content
                  $bladePath = $root . '/resources/views/app.blade.php';
                  if (file_exists($bladePath)) {
                      echo "\n--- Checking app.blade.php ---\n";
                      $content = file_get_contents($bladePath);
                      if (strpos($content, '@routes') !== false) {
                          echo "✅ Found '@routes' directive in app.blade.php\n";
                      } else {
                          echo "❌ '@routes' directive NOT FOUND in app.blade.php!\n";
                          echo "Content snippet:\n" . htmlspecialchars(substr($content, 0, 1500)) . "\n";
                      }
                  } else {
                      echo "❌ resources/views/app.blade.php NOT FOUND!\n";
                  }

                  // 0. Extract Release.zip (CRITICAL STEP)
                  $zipPath = $root . '/release.zip';
                  if (file_exists($zipPath)) {
                      echo "\n--- Extracting release.zip ---\n";
                      $zip = new ZipArchive;
                      if ($zip->open($zipPath) === TRUE) {
                          $zip->extractTo($root);
                          $zip->close();
                          echo "✅ Extracted release.zip successfully.\n";
                          // unlink($zipPath); // Optional: keep for debugging or delete
                      } else {
                          echo "❌ Failed to open release.zip\n";
                      }
                  } else {
                      echo "⚠️ release.zip not found. Skipping extraction (assuming files are already there).\n";
                  }

                  // 1. Check .env
                  $envPath = $root . '/.env';
                  if (!file_exists($envPath)) {
                      echo "⚠️ .env file NOT FOUND! Creating from .env.example...\n";
                      if (file_exists($root . '/.env.example')) {
                          copy($root . '/.env.example', $envPath);
                          echo "✅ Created .env from .env.example\n";
                      } else {
                          die("❌ .env.example also missing. Cannot proceed.\n");
                      }
                  }

                  // 1. Setup SQLite
                  echo "\n--- SQLite Setup ---\n";
                  $dbFile = $root . '/database/database.sqlite';
                  $dbDir = dirname($dbFile);

                  if (!file_exists($dbDir)) {
                      mkdir($dbDir, 0775, true);
                  }
                  if (!file_exists($dbFile)) {
                      touch($dbFile);
                      echo "✅ Created database.sqlite\n";
                  }
                  chmod($dbFile, 0666); // Read/write for everyone
                  chmod($dbDir, 0775);  // Writable directory for lock files
                  echo "✅ SQLite permissions set.\n";

                  // Update .env with absolute path
                  $envContent = file_get_contents($envPath);
                  $envContent = preg_replace('/^DB_CONNECTION=.*$/m', 'DB_CONNECTION=sqlite', $envContent);
                  // Quote the path just in case
                  $envContent = preg_replace('/^DB_DATABASE=.*$/m', 'DB_DATABASE="' . $dbFile . '"', $envContent);
                  // Comment out MySQL vars
                  $envContent = preg_replace('/^(DB_HOST|DB_PORT|DB_USERNAME|DB_PASSWORD)=/m', '#$1=', $envContent);
                  // Force CACHE_DRIVER=file to avoid DB connection during cache clear
                  if (preg_match('/^CACHE_DRIVER=/m', $envContent)) {
                      $envContent = preg_replace('/^CACHE_DRIVER=.*$/m', 'CACHE_DRIVER=file', $envContent);
                  } else {
                      $envContent .= "\nCACHE_DRIVER=file\n";
                  }
                  file_put_contents($envPath, $envContent);
                  echo "✅ Updated .env (SQLite + Cache Driver).\n";

                  // 2. Fix APP_KEY
                  $envContent = file_get_contents($envPath);
                  if (!preg_match('/^APP_KEY=base64:[a-zA-Z0-9\/+=]{44}/m', $envContent)) {
                      echo "⚠️ Invalid or missing APP_KEY. Generating new key...\n";
                      try {
                          $key = 'base64:' . base64_encode(random_bytes(32));
                          if (preg_match('/^APP_KEY=/m', $envContent)) {
                              $envContent = preg_replace('/^APP_KEY=.*$/m', "APP_KEY=$key", $envContent);
                          } else {
                              $envContent .= "\nAPP_KEY=$key\n";
                          }
                          file_put_contents($envPath, $envContent);
                          echo "✅ APP_KEY updated in .env\n";
                      } catch (Exception $e) {
                          echo "❌ Failed to generate random key: " . $e->getMessage() . "\n";
                      }
                  } else {
                      echo "✅ APP_KEY appears valid.\n";
                  }

                  // 3. Fix Permissions (General)
                  echo "\n--- Permissions ---\n";
                  $dirs = ['storage', 'storage/app', 'storage/app/public', 'storage/framework', 'storage/framework/views', 'storage/logs', 'bootstrap/cache'];
                  foreach ($dirs as $dir) {
                      $path = "$root/$dir";
                      if (!file_exists($path)) {
                          mkdir($path, 0775, true);
                          echo "Created $dir\n";
                      }
                      chmod($path, 0775);
                  }
                  echo "✅ Permissions set.\n";

                  // 4. FORCE CLEAR BOOTSTRAP CACHE (Critical Fix)
                  echo "\n--- Clearing Bootstrap Cache (Manual) ---\n";
                  $cacheFiles = [
                      $root . '/bootstrap/cache/config.php',
                      $root . '/bootstrap/cache/routes.php',
                      $root . '/bootstrap/cache/packages.php',
                      $root . '/bootstrap/cache/services.php'
                  ];
                  foreach ($cacheFiles as $file) {
                      if (file_exists($file)) {
                          unlink($file);
                          echo "🗑️ Deleted: " . basename($file) . "\n";
                      }
                  }
                  echo "✅ Bootstrap cache cleared.\n";

                  // 5. Manual Symlink
                  echo "\n--- Storage Symlink ---\n";
                  $target = $root . '/storage/app/public';
                  $link = $root . '/public/storage';
                  if (function_exists('symlink')) {
                      if (!file_exists($link)) {
                          if (symlink($target, $link)) {
                               echo "✅ Symlink created: $link -> $target\n";
                          } else {
                               echo "❌ Failed to create symlink (check permissions).\n";
                          }
                      } else {
                          echo "ℹ️ Symlink already exists.\n";
                      }
                  } else {
                      echo "⚠️ symlink() function disabled. Images may not load.\n";
                  }

                  // 6. Boot Laravel
                  echo "\n--- Booting Laravel ---\n";
                  try {
                      require $root . '/vendor/autoload.php';
                      $app = require_once $root . '/bootstrap/app.php';
                      $kernel = $app->make(Illuminate\Contracts\Console\Kernel::class);
                      echo "✅ Laravel Booted.\n";
                  } catch (Throwable $e) {
                      echo "❌ Failed to boot Laravel: " . $e->getMessage() . "\n";
                      echo "Stack trace:\n" . $e->getTraceAsString() . "\n";
                      exit;
                  }

                  function runCommand($cmd, $kernel) {
                      echo "Running: php artisan $cmd\n";
                      try {
                          $status = $kernel->call($cmd);
                          echo $kernel->output();
                          echo "Status: " . ($status == 0 ? 'SUCCESS' : 'ERROR') . "\n\n";
                      } catch (Exception $e) {
                          echo "❌ Exception: " . $e->getMessage() . "\n\n";
                      }
                  }

                  // 7. Run Commands
                  runCommand('optimize:clear', $kernel);
                  runCommand('migrate --force', $kernel);
                  runCommand('config:cache', $kernel);
                  runCommand('route:cache', $kernel);
                  runCommand('view:cache', $kernel);

                  echo "\n✨ Finalization Complete. You can now delete this file.\n";
                  ?>
                  PHP_FINALIZE

            - name: Runs FTP Diagnostics (Fixing Permissions)
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y lftp

                  echo "📦 Criando arquivo de teste..."
                  touch test_upload.txt
                  echo "test" > test_upload.txt

                  echo '🚀 Iniciando Diagnóstico Completo de FTP...'
                  # Objetivos:
                  # 1. Listar arquivos da raiz (para saber onde estamos)
                  # 2. Testar navegação absoluta (/www, /public_html)
                  # 3. Testar escrita (upload simples)

                  lftp -e "
                  debug 5
                  set ftp:ssl-allow false
                  set net:timeout 20

                  open -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} -p ${{ secrets.FTP_PORT || 21 }} ${{ secrets.FTP_HOST }}

                  echo '----------------------------------------'
                  echo '🔍 TENTATIVA 1: Listagem da Raiz'
                  cls -1 > root_files.txt
                  cat root_files.txt
                  echo '----------------------------------------'
                                    
                  echo '🔍 TENTATIVA 2: Navegação Absoluta (Teste de /www)'
                  cd /www && echo '✅ Entrou em /www' || echo '❌ Falha ao entrar em /www'

                  echo '🔍 TENTATIVA 3: Navegação Absoluta (Teste de /public_html)'
                  cd /public_html && echo '✅ Entrou em /public_html' || echo '❌ Falha ao entrar em /public_html'

                  echo '🔍 TENTATIVA 4: Upload de Teste na Raiz'
                  put test_upload.txt -o test_upload.txt || echo '❌ Falha de escrita na raiz'

                  bye
                  "

                  echo "📄 Conteúdo da listagem remota (root_files.txt):"
                  [ -f root_files.txt ] && cat root_files.txt || echo "⚠️ Arquivo de listagem vazio ou não gerado."
            - name: Trigger Finalize
              run: |
                  echo "Triggering finalize..."
                  curl -k -v "${{ secrets.APP_URL }}/finalize.php"

            - name: Verify deployment
              run: |
                  echo "✅ Deployment completed successfully!"
                  echo "🌐 Application URL: ${{ secrets.APP_URL }}"
                  echo ""
                  echo "⚠️  IMPORTANTE: Execute manualmente no servidor:"
                  echo "   cd ${{ secrets.FTP_SERVER_DIR }}"
                  echo "   bash deploy.sh"
